# Publicación de posts programados, gratis vía GitHub (cada 5 minutos).
#
# La app NO usa crons de Vercel (el plan Hobby los limita y complicaba el
# deploy). En su lugar, esta GitHub Action gratuita llama cada 5 min al endpoint
# /api/cron/publish para publicar los posts cuya hora ya llegó.
#
# Lo único obligatorio es el secret CRON_SECRET (GitHub → Settings → Secrets and
# variables → Actions), con el mismo valor que en Vercel. La URL sale de la
# variable CRON_URL si existe; si no, se usa la de producción de más abajo.
#
# Si falta el secret, el job FALLA a propósito: antes salía en verde sin haber
# llamado a nada y el calendario se quedaba parado sin que se notara.
name: publish-scheduled-posts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de publicación
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${CRON_URL:-https://social-media-autopost.vercel.app}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "POST $URL/api/cron/publish"
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/cron/publish")
          echo "HTTP $code"; cat /tmp/out.json || true
          # Un 401 significa que el secret no coincide con el de Vercel: eso sí
          # hay que verlo. Los demás errores pueden ser transitorios.
          [ "$code" = "401" ] && { echo "::error::CRON_SECRET no coincide con el de Vercel."; exit 1; }
          exit 0
