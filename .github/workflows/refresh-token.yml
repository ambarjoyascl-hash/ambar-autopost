# Refresco semanal de los tokens de Meta (Instagram/Facebook), gratis vía GitHub.
#
# Vercel (plan Hobby) limita las tareas automáticas, así que movemos también el
# refresco de tokens a una GitHub Action gratuita. Corre una vez por semana y
# llama al endpoint /api/cron/refresh-token de tu app.
#
# Usa lo mismo que la Action de publicación: el secret CRON_SECRET (obligatorio)
# y, opcionalmente, la variable CRON_URL para apuntar a otra URL.
name: refresh-meta-token

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refrescar tokens de Meta
        env:
          CRON_URL: ${{ vars.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${CRON_URL:-https://social-media-autopost.vercel.app}"
          URL="${URL%/}"   # sin esto, una barra final deja "//api/..." y Vercel responde 308
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Falta el secret CRON_SECRET en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "POST $URL/api/cron/refresh-token"
          code=$(curl -sL -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL/api/cron/refresh-token")
          echo "HTTP $code"; cat /tmp/out.json || true
          [ "$code" = "200" ] || echo "::warning::El endpoint respondió $code, no 200."
          [ "$code" = "401" ] && { echo "::error::CRON_SECRET no coincide con el de Vercel."; exit 1; }
          exit 0
